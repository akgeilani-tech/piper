name: linux

on: [ push, pull_request ]

env:
  UBUNTU_DEPS: |
      pkg-config gettext appstream tree
      python3 python-gi-dev python3-lxml python3-evdev
      gir1.2-gtk-3.0 gir1.2-rsvg-2.0 python3-gi-cairo gtk-update-icon-cache desktop-file-utils
  PIP_PACKAGES: meson ninja black==25.1.0 ruff==0.9.7

jobs:
  build-and-dist:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - name: debug
            meson_args: '-Druntime-dependency-checks=false'
          - name: plain
            meson_args: '-Druntime-dependency-checks=false -Dbuildtype=plain'
          - name: release
            meson_args: '-Druntime-dependency-checks=false -Dbuildtype=release'
          - name: runtime-checks
            meson_args: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $UBUNTU_DEPS
          python3 -m pip install --upgrade pip
          python3 -m pip install $PIP_PACKAGES
      - name: meson setup ${{ matrix.meson_args }}
        run: meson setup builddir --prefix="$PWD/_instdir" ${{ matrix.meson_args }}
      - name: ninja install
        run: ninja -C builddir install
      - name: meson test
        run: meson test -C builddir --print-errorlogs
      - name: ninja uninstall
        run: ninja -C builddir uninstall
      - name: list any files left after uninstall
        run: (test -d _instdir && tree _instdir) || exit 0
      # Capture all the meson logs, even if we failed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}  # even if we fail
        with:
          name: 'meson test logs ${{ matrix.name }}'
          path: |
            builddir/meson-logs/testlog*.txt
            builddir/meson-logs/meson-log.txt
